<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>历史明细 · 速达跨境计件</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2300288e'/><path d='M9 13l7-4 7 4v8l-7 4-7-4z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 字体为渐进增强：加载失败时回退到系统字体，不阻塞渲染 -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">

<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/chart.css">
<link rel="stylesheet" href="../assets/css/utilities.css">
</head>
<body>

<div class="l-shell">
  <div class="l-anchor" id="shell-anchor"></div>

  <main class="l-main" id="page-root">

    <!-- KPI 条 -->
    <section class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--space-md)">
      <div class="c-kpi">
        <div class="u-flex u-items-center u-justify-between">
          <span class="c-kpi__label">统计月份</span>
          <svg class="icon" style="font-size:18px;color:var(--c-text-muted)" aria-hidden="true"><use href="#i-calendar_month"></use></svg>
        </div>
        <div class="c-kpi__value c-kpi__value--sm" id="kpi-month" style="margin-top:6px">—</div>
        <div class="c-kpi__foot" id="kpi-days">—</div>
      </div>
      <div class="c-kpi">
        <div class="u-flex u-items-center u-justify-between">
          <span class="c-kpi__label">出勤打卡</span>
          <svg class="icon" style="font-size:18px;color:var(--c-text-muted)" aria-hidden="true"><use href="#i-how_to_reg"></use></svg>
        </div>
        <div class="u-flex u-items-baseline u-gap-sm" style="margin-top:6px">
          <span class="c-kpi__value c-kpi__value--sm" id="kpi-workdays">0</span>
          <span class="c-kpi__unit">天</span>
        </div>
        <div class="c-kpi__foot" id="kpi-missing">未记录 0 天</div>
      </div>
      <div class="c-kpi">
        <div class="u-flex u-items-center u-justify-between">
          <span class="c-kpi__label">总打包件数</span>
          <svg class="icon" style="font-size:18px;color:var(--c-secondary)" aria-hidden="true"><use href="#i-inventory"></use></svg>
        </div>
        <div class="u-flex u-items-baseline u-gap-sm" style="margin-top:6px">
          <span class="c-kpi__value c-kpi__value--sm" id="kpi-count" style="color:var(--c-primary)">0</span>
          <span class="c-kpi__unit">件</span>
        </div>
        <div class="c-kpi__foot" id="kpi-range">—</div>
      </div>
      <div class="c-kpi" style="border-color:var(--c-border-strong);background:var(--c-surface-card)">
        <div class="u-flex u-items-center u-justify-between">
          <span class="c-kpi__label" style="color:var(--c-income-deep)">预估计件收益</span>
          <svg class="icon" style="font-size:20px;color:var(--c-income)" aria-hidden="true"><use href="#i-payments"></use></svg>
        </div>
        <div class="mono" style="font-size:28px;line-height:36px;font-weight:700;color:var(--c-income-deep);margin-top:6px" id="kpi-income">¥0.00</div>
        <div class="c-kpi__foot">按当前单价核算</div>
      </div>
      <div class="c-kpi">
        <div class="u-flex u-items-center u-justify-between">
          <span class="c-kpi__label">日均打包人效</span>
          <svg class="icon" style="font-size:18px;color:var(--c-text-muted)" aria-hidden="true"><use href="#i-speed"></use></svg>
        </div>
        <div class="u-flex u-items-baseline u-gap-sm" style="margin-top:6px">
          <span class="c-kpi__value c-kpi__value--sm" id="kpi-avg">0</span>
          <span class="c-kpi__unit">件/天</span>
        </div>
        <div class="c-kpi__foot" id="kpi-avg-income">日均 ¥0.00</div>
      </div>
    </section>

    <!-- 筛选条 -->
    <section class="c-card" style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-md);flex-wrap:wrap">
      <div class="u-flex u-items-center u-gap-md">
        <div class="u-flex u-items-center" style="border:1px solid var(--c-border-strong);border-radius:var(--radius-md);background:var(--c-surface-card)">
          <button type="button" class="c-row-btn" id="hist-prev" style="border:0;border-right:1px solid var(--c-border-strong);border-radius:0" aria-label="上一月">‹</button>
          <span class="mono u-strong u-sm u-flex u-items-center u-gap-sm" style="padding:6px 14px">
            <svg class="icon" style="font-size:16px;color:var(--c-text-muted)" aria-hidden="true"><use href="#i-event"></use></svg>
            <span id="hist-month">—</span>
          </span>
          <button type="button" class="c-row-btn" id="hist-next" style="border:0;border-left:1px solid var(--c-border-strong);border-radius:0" aria-label="下一月">›</button>
        </div>
        <button type="button" class="c-btn c-btn--ghost c-btn--sm" id="hist-this-month">本月至今</button>
      </div>

      <div class="u-flex u-items-center u-gap-md" style="flex-wrap:wrap">
        <div style="position:relative">
          <svg class="icon" style="position:absolute;left:10px;top:8px;font-size:18px;color:var(--c-text-muted)" aria-hidden="true"><use href="#i-search"></use></svg>
          <input type="search" id="hist-search" class="c-input c-input--sm" style="width:280px;padding-left:34px" placeholder="搜索备注或日期，如「加班」或「10/12」">
        </div>
        <input type="date" id="hist-from" class="c-input c-input--sm" aria-label="起始日期">
        <span class="u-sm u-muted">至</span>
        <input type="date" id="hist-to" class="c-input c-input--sm" aria-label="结束日期">
        <button type="button" class="c-row-btn" id="hist-reset" title="重置筛选">重置</button>
      </div>
    </section>

    <div class="l-grid-12">

      <!-- 左：补录通道 -->
      <section class="l-col-4">
        <div class="c-card c-card--pad" style="display:flex;flex-direction:column;gap:var(--space-md)">
          <div class="c-card__head">
            <span class="u-flex u-items-center u-gap-sm">
              <span class="c-dot c-dot--ok"></span>
              <span class="c-card__title">历史补录通道</span>
            </span>
            <span class="c-badge c-badge--primary">PRD F-003</span>
          </div>

          <div class="c-alert c-alert--warn">
            <svg class="icon" style="font-size:18px;flex:none;color:var(--c-income)" aria-hidden="true"><use href="#i-info"></use></svg>
            <div><strong>补录规范：</strong>不允许选择未来日期；同一天仅允许一条记录，保存后自动覆盖原有数据。</div>
          </div>

          <form id="backfill-form" novalidate>
            <div class="c-field" style="margin-bottom:var(--space-md)">
              <div class="c-label">
                <label for="bf-date">补录业务日期</label>
                <span class="u-sm" style="color:var(--c-error-deep)">不可选未来日期</span>
              </div>
              <input type="date" id="bf-date" class="c-input" required>
            </div>

            <div class="c-field" style="margin-bottom:var(--space-md)">
              <div class="c-label">
                <label for="bf-count">打包件数（实物计数）</label>
                <span class="u-sm u-muted">单位：件</span>
              </div>
              <div style="position:relative">
                <input type="number" id="bf-count" class="c-input c-input--lg" inputmode="numeric" min="0" step="1" placeholder="0" required>
                <span class="u-label" style="position:absolute;right:16px;top:50%;transform:translateY(-50%)">件</span>
              </div>
              <div class="grid grid-cols-4 u-gap-sm" style="margin-top:6px">
                <button type="button" class="c-step" data-bf-step="1">+1</button>
                <button type="button" class="c-step" data-bf-step="5">+5</button>
                <button type="button" class="c-step" data-bf-step="10">+10</button>
                <button type="button" class="c-step" data-bf-step="50">+50</button>
              </div>
            </div>

            <div class="c-field" style="margin-bottom:var(--space-md)">
              <label class="u-label" for="bf-note">补录事由与备注</label>
              <input type="text" id="bf-note" class="c-input" maxlength="100" placeholder="例：漏打卡 / 整托加班补记">
            </div>

            <div class="c-card" style="background:var(--c-surface-elevated);display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-md)">
              <div style="display:flex;flex-direction:column">
                <span class="u-sm u-muted">结算单价（核定）<span class="mono" id="bf-price">¥1.50</span>/件</span>
                <span class="u-sm u-strong">预估本次补录收益</span>
              </div>
              <span class="mono" style="font-size:24px;font-weight:700;color:var(--c-income-deep)" id="bf-income">¥0.00</span>
            </div>

            <button type="submit" class="c-btn c-btn--primary c-btn--lg c-btn--block">
              <svg class="icon" style="font-size:20px" aria-hidden="true"><use href="#i-post_add"></use></svg>
              确认保存补录单
            </button>
          </form>

          <p class="u-xs u-muted u-flex u-items-center u-justify-between" style="padding-top:8px;border-top:1px solid var(--c-border-subtle)">
            <span>操作人：<span id="bf-operator">—</span></span>
            <span>数据存于本机浏览器</span>
          </p>
        </div>
      </section>

      <!-- 右：流水账本 -->
      <section class="l-col-8">
        <div class="c-card" style="display:flex;flex-direction:column">
          <div class="c-card__head">
            <span class="u-flex u-items-center u-gap-sm">
              <span class="c-card__title" id="ledger-title">打包流水账本</span>
              <span class="c-badge" id="ledger-count">共 0 条</span>
            </span>
            <span class="u-sm u-muted">按日期倒序 · 就地改单（无弹窗）</span>
          </div>

          <div style="overflow-x:auto">
            <table class="c-table">
              <thead>
                <tr>
                  <th scope="col">日期（星期）</th>
                  <th scope="col" class="num">打包件数</th>
                  <th scope="col" class="num">计费单价</th>
                  <th scope="col" class="num">当日小计</th>
                  <th scope="col">备注说明</th>
                  <th scope="col" style="text-align:center">操作</th>
                </tr>
              </thead>
              <tbody id="ledger-body"></tbody>
            </table>
          </div>
          <div class="c-table__empty" id="ledger-empty" hidden>没有匹配的记录，换个月份或清空筛选条件试试。</div>
        </div>
      </section>
    </div>
  </main>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/core.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/icons.js"></script>
<script src="../assets/js/avatar.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/pages/history.js"></script>
</body>
</html>
